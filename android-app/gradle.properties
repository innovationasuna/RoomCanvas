# 工程路径含中文：Windows 下 Gradle 用 daemon 的 file.encoding 写测试 worker 的
# classpath argfile，而 JVM 启动器按系统 ANSI 代码页（简体中文为 GBK）读取。
# 若这里声明 UTF-8，测试 worker 会因 classpath 乱码报 ClassNotFoundException。
# 源码仍由 Kotlin / javac 各按 UTF-8 读取，不受此设置影响。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=GBK
android.useAndroidX=true
android.nonTransitiveRClass=true
android.overridePathCheck=true
