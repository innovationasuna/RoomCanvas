<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#252623">
<title>重建过程 · RoomCanvas</title>
<link rel="icon" href="./icon.svg">
<link rel="stylesheet" href="./theme.css">
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<style>
  :root {--rc-amber: #eea294; --rc-fill: #8d7b58;}
  * {box-sizing: border-box;}
  html, body {margin: 0; height: 100%;}
  body {display: grid; grid-template-rows: 64px minmax(0, 1fr) 74px; height: 100vh; overflow: hidden; font-size: 14px; line-height: 1.5;}
  button {font: inherit; color: var(--rc-text); cursor: pointer; border: 1px solid var(--rc-line); background: var(--rc-raised); border-radius: 8px; padding: 4px 10px;}
  button:is(:hover, :focus-visible, :active) {border-color: var(--rc-green); color: var(--rc-green); background: var(--rc-active);}
  :is(a, button):focus-visible {outline: 2px solid var(--rc-green); outline-offset: 4px;}
  select {font: inherit; font-size: 13px; color: var(--rc-text); cursor: pointer; border: 1px solid var(--rc-line); background: var(--rc-raised); border-radius: 8px; height: 32px; padding: 0 6px;}
  select:is(:hover, :focus-visible) {border-color: var(--rc-green); color: var(--rc-green);}
  svg {width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none;}
  /* Header: same height, padding, icon and type as the room list (web/home.css .home-header). */
  header {display: flex; align-items: center; gap: 24px; padding: 0 24px; background: var(--rc-bg); border-bottom: 1px solid var(--rc-line); min-width: 0;}
  header .brand {display: flex; align-items: center; gap: 9px; font-size: 17px; font-weight: 600; letter-spacing: -.6px; white-space: nowrap; color: inherit; text-decoration: none;}
  header .brand svg {width: 27px; height: 30px; color: var(--rc-green); stroke-width: 1.5;}
  header .context {padding-left: 24px; border-left: 1px solid var(--rc-line); font-size: 13px; color: var(--rc-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;}
  header .context b {color: var(--rc-text); font-weight: 600; margin-right: 8px;}
  header .live {display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--rc-green);}
  header .live::before {content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--rc-green); animation: pulse 1.6s ease-in-out infinite;}
  @keyframes pulse {50% {opacity: .3;}}
  [hidden] {display: none !important;}
  header .result {margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 13px;}
  header .back {font-size: 13px; color: var(--rc-muted); text-decoration: none; white-space: nowrap;}
  header .back:is(:hover, :focus-visible, :active) {color: var(--rc-green);}
  .tag {display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 99px;}
  .tag.warn {background: #3d2f2a; color: var(--rc-warn);}
  .tag.ok {background: var(--rc-active); color: var(--rc-green);}
  main {display: grid; grid-template-columns: clamp(250px, 22vw, 330px) minmax(0, 1fr); min-height: 0;}
  .side {display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--rc-panel); border-right: 1px solid var(--rc-line); min-height: 0; min-width: 0; overflow: hidden;}
  .log {overflow-y: auto; overflow-x: hidden; padding: 16px 18px 24px; min-width: 0; container-type: inline-size; overflow-anchor: none;}
  .user {margin-left: 48px; background: var(--rc-raised); border-radius: 8px 8px 3px 8px; padding: 10px 14px; margin-bottom: 18px;}
  .who {display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 4px 0 8px;}
  .who i {width: 22px; height: 22px; border-radius: 5px; background: var(--rc-green); color: var(--rc-bg); display: grid; place-items: center; font-style: normal; font-size: 12px;}
  /* The record: a line with its picture beside it; cards gather a run of objects or a stretch of the agent's work. */
  .line {margin: 0 0 10px; cursor: pointer; overflow-wrap: anywhere;}
  .line .k {font-size: 11px; color: var(--rc-muted); margin-right: 6px;}
  .line .times {font-size: 12px; color: var(--rc-muted); margin-left: 6px; font-variant-numeric: tabular-nums;}
  .line.ms {font-weight: 600;}
  .line.rv {border-left: 3px solid var(--rc-amber); padding-left: 10px;}
  .line.now, .line.now .k {color: var(--rc-green);}
  .row {display: flex; gap: 10px; align-items: flex-start; margin: 0 0 10px;}
  .row > .line, .card .text {flex: 1; min-width: 0; margin-bottom: 0;}
  .card {margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--rc-line); border-radius: 8px; background: var(--rc-field); font-size: 13px;}
  .card.work {display: flex; gap: 10px; align-items: flex-start;}
  .card .line {margin: 0;}
  .card .line + .line, .card .fold + .line {margin-top: 4px;}
  .card .lead {font-weight: 600; font-size: 14px;}
  .objects .lead, .work .text > .line:first-child:not(:last-child) {position: sticky; top: 0; z-index: 1; background: var(--rc-field);}
  .log button.fold {display: block; border: 0; background: none; padding: 2px 0; font-size: 12px; color: var(--rc-muted);}
  .log button.fold:is(:hover, :focus-visible) {color: var(--rc-green); background: none;}
  .card .detail {margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rc-line);}
  .th {flex: none; width: 72px; height: 72px; border-radius: 6px; overflow: hidden; border: 1px solid var(--rc-line); background: var(--rc-raised); cursor: zoom-in;}
  .th img {display: block; width: 100%; height: 100%; object-fit: cover;}
  .pics {flex: none; display: grid; gap: 4px;}
  .pics.n2 .th {width: 56px; height: 56px;}
  .wide {display: block; width: fit-content; max-width: 100%; height: 96px; margin: -4px 0 10px; cursor: zoom-in;}
  .wide img {display: block; height: 100%; width: auto; max-width: 100%; object-fit: contain; border-radius: 6px; border: 1px solid var(--rc-line); background: var(--rc-raised);}
  .grid {display: grid; grid-template-columns: repeat(3, minmax(0, 96px)); gap: 6px; margin: 8px 0 2px;}
  .cell {display: grid; gap: 2px; min-width: 0; cursor: zoom-in;}
  .cell img {display: block; width: 100%; aspect-ratio: 1; object-fit: contain; border-radius: 6px; border: 1px solid var(--rc-line); background: var(--rc-raised);}
  .cut {display: block; position: relative; overflow: hidden; width: 100%; height: 100%;}
  .cell .cut {aspect-ratio: 1; height: auto; border-radius: 6px; border: 1px solid var(--rc-line); background: var(--rc-raised);}
  .cut img, .cell .cut img {position: absolute; max-width: none; aspect-ratio: auto; border: 0; border-radius: 0; object-fit: fill;}
  .cell.now .cut {border-color: var(--rc-green);}
  .cell .nm {font-size: 11px; color: var(--rc-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
  .cell.now img {border-color: var(--rc-green);}
  .cell.now .nm {color: var(--rc-green);}
  .log button.more {aspect-ratio: 1; place-items: center; padding: 0; border: 1px dashed var(--rc-line); border-radius: 6px; background: none; color: var(--rc-muted); font-size: 14px; cursor: pointer;}
  .card .bare {margin: 6px 0 0; font-size: 12px; color: var(--rc-muted);}
  .stage-h {font-size: 12px; color: var(--rc-muted); margin: 18px 0 8px; display: flex; align-items: center; gap: 8px;}
  .stage-h::after {content: ''; flex: 1; border-top: 1px solid var(--rc-line);}
  .pending {font-size: 13px; color: var(--rc-muted);}
  /* A narrow record (the column at its narrowest): smaller pictures, so the words keep their width. */
  @container (max-width: 240px) {
    .th {width: 56px; height: 56px;}
    .pics.n2 .th {width: 48px; height: 48px;}
    .wide {height: 80px;}
  }
  .plan {border-top: 1px solid var(--rc-line); padding: 12px 18px 14px;}
  .plan .top {display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--rc-muted);}
  .plan .top > span:first-child {white-space: nowrap;}
  .plan .dots {margin-left: auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 3px; min-width: 0;}
  .plan .dots i {width: 6px; height: 6px; border-radius: 50%; background: var(--rc-control); cursor: pointer;}
  .plan .dots i.done {background: var(--rc-green);}
  .plan .dots i.now {background: var(--rc-panel); box-shadow: inset 0 0 0 2px var(--rc-green);}
  .plan .dots i.fail {background: var(--rc-panel); box-shadow: inset 0 0 0 2px var(--rc-warn);}
  .plan .name {font-size: 15px; font-weight: 600; margin: 4px 0 2px;}
  .plan .name.fail {color: var(--rc-warn);}
  .plan .desc {font-size: 12.5px; color: var(--rc-muted);}
  .stagewrap {position: relative; min-width: 0; min-height: 0;}
  .view {position: absolute; inset: 0; background: var(--rc-canvas); overflow: hidden;}
  .view > canvas {width: 100%; height: 100%;}
  .loading {position: absolute; inset: 0; display: grid; place-items: center; color: #47513f; font-size: 13px; z-index: 1;}
  .loading.error {color: #8a3d33;}
  .loading:has(> .pick) {overflow-y: auto;}
  .pick {display: grid; gap: 8px; min-width: min(360px, 80vw);}
  .pick-title {font-size: 13px; color: #47513f; margin-bottom: 4px;}
  .pick a {display: flex; justify-content: space-between; gap: 16px; padding: 12px 14px; border-radius: 8px; background: rgba(255,255,255,.55); color: #2a2f25; text-decoration: none; font-size: 14px;}
  .pick a:hover {background: rgba(255,255,255,.8);}
  .pick a span {color: #6b7563; font-size: 12px;}
  .notice {position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--rc-bg); color: var(--rc-warn); border: 1px solid var(--rc-line);}
  .forming {position: absolute; left: 16px; bottom: 16px; font-size: 12px; padding: 4px 10px; border-radius: 99px; background: #f4f1e8d9; color: #2f6f8c; border: 1px solid #9fc6d6; font-variant-numeric: tabular-nums; pointer-events: none;}
  .forming[hidden] {display: none;}
  .room-version {position: absolute; top: 12px; left: 12px; padding: 3px 8px; border-radius: 4px; background: #f4f1e8e6; color: #444d40; font-size: 12px; pointer-events: none;}
  .room-version:empty {display: none;}
  #latest {position: absolute; right: 16px; bottom: 16px; background: var(--rc-bg); color: var(--rc-green); border-color: #75674b;}
  .lightbox {position: fixed; inset: 0; background: #1b1c19ee; display: none; place-items: center; padding: 28px; cursor: zoom-out; z-index: 5;}
  .lightbox.on {display: grid;}
  .lightbox img {max-height: calc(100vh - 230px); max-width: 100%; border-radius: 6px;}
  .lightbox .cap {color: var(--rc-text); margin-top: 10px; text-align: center; font-size: 14px;}
  footer {display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 18px; align-items: center; padding: 0 20px; background: var(--rc-bg); border-top: 1px solid var(--rc-line);}
  .btns {display: flex; gap: 6px;}
  .btns button {width: 36px; height: 32px; padding: 0; display: grid; place-items: center;}
  .btns svg {pointer-events: none;}
  .btns #play {background: var(--rc-green); border-color: var(--rc-green); color: var(--rc-bg);}
  .track {--track-center: 13px; position: relative; height: 40px; cursor: pointer; touch-action: none; user-select: none;}
  .track .seg {position: absolute; top: 0; height: 22px;}
  .track .bar {position: absolute; top: calc(var(--track-center) - 4px); left: 0; right: min(3px, 25%); height: 8px; border-radius: 3px; background: var(--rc-line);}
  .track .seg .fill {position: absolute; inset: 0; right: auto; border-radius: 3px; background: var(--rc-fill);}
  .track .lab {position: absolute; top: 22px; font-size: 11.5px; color: var(--rc-muted); white-space: nowrap;}
  .track .lab.now {color: var(--rc-green); font-weight: 600; z-index: 1; background: var(--rc-bg); padding-right: 6px;}
  .track .lab.end {transform: translateX(-100%); padding: 0 0 0 6px;}
  .track .lab.tight {visibility: hidden;}
  .track .lab.now.tight {visibility: visible;}
  .track .lab.covered {visibility: hidden;}
  .track .head {position: absolute; top: var(--track-center); width: 14px; height: 14px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--rc-green); border: 2px solid var(--rc-bg); box-shadow: 0 0 0 1px var(--rc-green); pointer-events: none;}
  .track .mk {position: absolute; top: 2px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; pointer-events: none;}
  .track .mk.v {background: var(--rc-text);}
  .track .mk.r {background: var(--rc-amber);}
  .clock {font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap;}
  .clock span {color: var(--rc-muted);}
  @media (max-width: 600px) {
    body {grid-template-rows: 56px minmax(0, 1fr) 74px;}
    header {padding: 0 16px;}
    header .context {display: none;}
    main {grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 40%;}
    .side {order: 2; border-right: 0; border-top: 1px solid var(--rc-line);}
  }
</style>
</head>
<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true">
  <symbol id="i-brand" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.6 8-4.6M12 12v9M8 5.3l8 4.6v5.3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8L7 4Z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M19 5 9 12l10 7V5Z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7V5Z"/></symbol>
</svg>
<header>
  <a class="brand" href="./" aria-label="RoomCanvas 房间选择"><svg aria-hidden="true"><use href="#i-brand"/></svg><span>RoomCanvas</span></a>
  <span class="context" id="context">重建过程</span>
  <span class="live" id="live" hidden>重建中</span>
  <span class="result" id="result"></span>
  <a class="back" href="./">← 房间与重建任务</a>
</header>
<main>
  <aside class="side">
    <div class="log" id="log"></div>
    <div class="plan"><div class="top"><span id="planN"></span><span class="dots" id="dots"></span></div><div class="name" id="planName"></div><div class="desc" id="planDesc"></div></div>
  </aside>
  <section class="stagewrap">
    <div class="view" id="view"><div class="loading" id="loading">正在读取重建过程…</div><span class="room-version"></span></div>
    <div class="notice" id="liveError" hidden>暂时连不上房间重建服务，稍后自动重试</div>
    <button type="button" id="latest" hidden>回到最新</button>
  </section>
  <div class="lightbox" id="lb"></div>
</main>
<footer>
  <div class="btns"><button id="prev" title="上一条记录（←）"><svg><use href="#i-prev"/></svg></button><button id="play" title="播放 / 暂停（空格）"><svg><use href="#i-play"/></svg></button><button id="next" title="下一条记录（→）"><svg><use href="#i-next"/></svg></button></div>
  <div class="track" id="track"></div>
  <div class="clock"><b id="clock">0:00:00</b> <span id="total">/ 0:00:00</span></div>
  <select id="speed" title="播放速度" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
</footer>
<script type="module" src="./replay/replay.mjs"></script>
</body>
</html>
