<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoomCanvas 手势布置</title></head><body>
<header><h1>RoomCanvas 手势布置</h1><div class="address"><label for="address">房间布局地址</label><input id="address" type="url"><button id="connect">连接场景</button></div>
<div class="controls"><button id="start" disabled>开启摄像头</button><button id="stop" disabled>关闭摄像头</button><button data-mode="move" aria-pressed="false" disabled>移动物体</button><button data-mode="height" aria-pressed="false" disabled>抬高物体</button><button data-mode="scale" aria-pressed="false" disabled>缩放场景</button><button data-mode="rotate" aria-pressed="false" disabled>旋转物体</button><button data-mode="view" aria-pressed="true" disabled>仅观察房间</button><button id="cancel">取消当前操作</button></div>
<p>左手 1 移动、2 抬高、3 缩放、4 旋转，保持约 0.4 秒。数字 3 为拇食指成圈，其余三指伸出；切换后先松手再捏合。</p><p id="gesture-help">左手捏合环绕，右手操作家具；松手保留预览，竖拇指确认放置。</p><p id="scene-status" role="status">正在连接…</p></header>
<div class="workspace"><iframe id="scene" title="RoomCanvas 房间编辑器"></iframe><aside class="camera-panel"><div class="camera-preview"><video id="camera" autoplay muted playsinline></video><canvas id="skeleton" width="640" height="480" aria-hidden="true"></canvas></div><p id="camera-status" role="status">摄像头未开启</p><p id="left-status" role="status">左手检测未开启</p><progress id="left-progress" max="1" value="0" aria-label="左手数字确认进度"></progress><p id="right-status" role="status">右手确认检测未开启</p><progress id="right-progress" max="1" value="0" aria-label="右手放置确认进度"></progress><small>镜像预览；丢手冻结预览，恢复后先松手再抓取。确认后才保存布置。摄像头画面仅在本机识别。</small></aside></div>
<script type="module" src="/src/integration/main.ts"></script></body></html>
